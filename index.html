<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishan ❤️ Jasmine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
position:relative;
background:linear-gradient(135deg,#ff5fa2,#ffd1dc);
}

/* Background Photos */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(5,1fr);
grid-template-rows:repeat(2,1fr);
gap:8px;
padding:8px;
z-index:-2;
opacity:0.20;
overflow:hidden;
}

.bg img{
width:100%;
height:100%;
object-fit:cover;
border-radius:10px;
}

/* Pink Overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,192,203,.45);
z-index:-1;
}

.card{
width:90%;
max-width:450px;
background:rgba(255,255,255,.92);
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.35);
backdrop-filter:blur(8px);
}

h1{
color:#ff0066;
margin-bottom:15px;
}

p{
font-size:18px;
margin:10px 0;
}

button{
padding:12px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:10px;
}

#yes{
background:#ff0066;
color:white;
}

#no{
background:#ddd;
}

#result{
margin-top:20px;
font-size:22px;
color:#ff0066;
font-weight:bold;
}
</style>
</head>

<body>

<div class="bg">
<img src="PHOTO1.JPG">
<img src="PHOTO2.JPG">
<img src="PHOTO3.JPG">
<img src="PHOTO4.JPG">
<img src="PHOTO5.JPG">
<img src="PHOTO6.JPG">
<img src="PHOTO7.JPG">
<img src="PHOTO8.JPG">
<img src="PHOTO9.JPG">
<img src="PHOTO10.JPG">
</div>

<div class="card">

<h1>❤️ Dear Jasmine ❤️</h1>

<p>Har din tumhari muskaan meri duniya ko aur khoobsurat bana deti hai.</p>

<p>Main dil se sirf ek baat kehna chahta hoon...</p>

<h2 style="color:#ff0066;">Will You Be My Forever? 💍</h2>

<div id="result"></div>

<button id="yes">Yes ❤️</button>
<button id="no">No 😅</button>
<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const result = document.getElementById("result");

yes.onclick = function(){

result.innerHTML = `
💖 Thank You Jasmine 💖<br><br>
❤️ Kishan ❤️ Jasmine Forever ❤️<br><br>
🌹 I Love You Forever 🌹
`;

for(let i=0;i<100;i++){
createHeart();
}

};

no.onmouseover = function(){

no.style.position = "absolute";

no.style.left = Math.random()*80 + "%";

no.style.top = Math.random()*80 + "%";

};

function createHeart(){

let heart = document.createElement("div");

heart.innerHTML = ["❤️","💖","💕","💗"][Math.floor(Math.random()*4)];

heart.style.position = "fixed";

heart.style.left = Math.random()*100 + "vw";

heart.style.top = "-30px";

heart.style.fontSize = (20 + Math.random()*20) + "px";

heart.style.zIndex = "999";

heart.style.transition = "transform 6s linear";

document.body.appendChild(heart);

setTimeout(()=>{
heart.style.transform = "translateY(110vh) rotate(720deg)";
},50);

setTimeout(()=>{
heart.remove();
},6000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
